[project]
name = "project"
version = "0.1.0"
description = "LangChain-based iPhone 17 Pro Max review analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "google-api-python-client>=2.184.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "selenium>=4.36.0",
    "pandas>=2.3.3",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "openai>=1.0.0",
    "google-generativeai>=0.8.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "wordcloud>=1.9.0",
    "nltk>=3.8.0",
    "vaderSentiment>=3.3.2",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "keybert>=0.8.0",
    "bertopic>=0.16.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "uv>=0.9.2",
]
